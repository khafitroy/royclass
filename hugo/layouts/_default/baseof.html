<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#1a1a2e;--sub:#666;--nav-bg:#1a1a2e;--nav-text:#fff;--btn-bg:#1a1a2e;--btn-text:#fff;--footer-text:#888;--footer-border:#eee;--shadow:rgba(0,0,0,0.06);--page-bg:#f0f2f5;--card-border:#e5e7eb;--input-border:#d1d5db;--input-bg:#fff;--accent:#111827;--accent-2:#1f3a5f;--muted:#64748b;--btn-ghost:#e5e7eb;--btn-ghost-text:#333;--danger:#d32f2f;--green:#2e7d32;--green-bg:#e8f5e9;--green-border:#4caf50;--red:#d32f2f;--red-bg:#ffebee;--red-border:#d32f2f;--amber-bg:#fef3c7;--amber-text:#92400e;--info-bg:#ecfeff;--info-text:#155e75;--feedback-bg:#fefce8;--feedback-border:#fde68a;--alert-bg:#fee2e2;--alert-border:#fca5a5;--alert-text:#991b1b;--expl-bg:#f0f4ff;--expl-text:#333;--thead-bg:#f8fafc;--row-border:#e5e7eb;--sel-bg:#f0f0f8;--num-empty:#999;--teal:#0f766e;--icon-murid:#2563eb;--icon-murid-2:#60a5fa;--icon-guru:#7c3aed;--icon-guru-2:#a78bfa;--icon-k8:#4f46e5;--icon-k8-2:#818cf8;--icon-k9:#059669;--icon-k9-2:#34d399;--bc1a:#2563eb;--bc1b:#60a5fa;--bc2a:#0d9488;--bc2b:#2dd4bf;--bc3a:#059669;--bc3b:#34d399;--bc4a:#d97706;--bc4b:#fbbf24;--bc5a:#ea580c;--bc5b:#fb923c;--bc6a:#dc2626;--bc6b:#f87171;--bc7a:#7c3aed;--bc7b:#a78bfa;--bc8a:#4f46e5;--bc8b:#818cf8;--bc9a:#db2777;--bc9b:#f472b6}
[data-theme="dark"]{--bg:#0f0f1a;--card:#1e1e32;--text:#e0e0e0;--sub:#999;--nav-bg:#0a0a14;--nav-text:#e0e0e0;--btn-bg:#3a3a5c;--btn-text:#e0e0e0;--footer-text:#666;--footer-border:#2a2a3a;--shadow:rgba(0,0,0,0.25);--page-bg:#0f0f1a;--card-border:#2f2f4a;--input-border:#44446a;--input-bg:#262640;--accent:#3a3a5c;--accent-2:#1f3a5f;--muted:#8f8fa8;--btn-ghost:#3a3a5c;--btn-ghost-text:#e0e0e0;--danger:#ef5350;--green:#7bc47f;--green-bg:#1d3a24;--green-border:#4caf50;--red:#ef5350;--red-bg:#3d1f24;--red-border:#ef5350;--amber-bg:#3d3016;--amber-text:#fbbf24;--info-bg:#0e2733;--info-text:#7dd3fc;--feedback-bg:#3a3218;--feedback-border:#a78b3a;--alert-bg:#3d1f24;--alert-border:#b05c5c;--alert-text:#fca5a5;--expl-bg:#1a2340;--expl-text:#d0d0e0;--thead-bg:#252540;--row-border:#2f2f4a;--sel-bg:#2c2c4a;--num-empty:#777;--teal:#5eead4;--icon-murid:#3b82f6;--icon-murid-2:#93c5fd;--icon-guru:#8b5cf6;--icon-guru-2:#c4b5fd;--icon-k8:#6366f1;--icon-k8-2:#a5b4fc;--icon-k9:#10b981;--icon-k9-2:#6ee7b7;--bc1a:#3b82f6;--bc1b:#93c5fd;--bc2a:#14b8a6;--bc2b:#5eead4;--bc3a:#10b981;--bc3b:#6ee7b7;--bc4a:#f59e0b;--bc4b:#fcd34d;--bc5a:#f97316;--bc5b:#fdba74;--bc6a:#ef4444;--bc6b:#fca5a5;--bc7a:#8b5cf6;--bc7b:#c4b5fd;--bc8a:#6366f1;--bc8b:#a5b4fc;--bc9a:#ec4899;--bc9b:#f9a8d4}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:var(--text);background:var(--bg);min-height:100vh;transition:background .3s,color .3s}
.container{max-width:960px;margin:0 auto;padding:0 16px}
nav{background:var(--nav-bg);padding:10px 0;position:sticky;top:0;z-index:100}
nav .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
nav a{color:var(--nav-text);text-decoration:none;font-weight:600}
nav .brand{font-size:20px}
nav .links{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
nav .links a{font-size:14px;opacity:.85}
nav .links a:hover{opacity:1}
.dark-toggle{background:none;border:1px solid rgba(255,255,255,.3);color:var(--nav-text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1}
main{min-height:70vh;padding:32px 0}
.prose{max-width:720px;margin:0 auto}
.prose h1{font-size:clamp(22px,4vw,32px);margin-bottom:8px}
.prose h2{font-size:clamp(18px,3vw,24px);margin:28px 0 12px;border-bottom:2px solid #eee;padding-bottom:6px}
.prose h3{font-size:clamp(16px,2.5vw,20px);margin:20px 0 8px}
.prose p{font-size:16px;margin:12px 0;color:var(--text)}
.prose ul,.prose ol{margin:8px 0 12px 24px}
.prose li{margin:4px 0;font-size:15px}
.prose strong{color:var(--text)}
.prose blockquote{background:rgba(14,165,233,0.08);border-left:4px solid #0ea5e9;padding:12px 16px;margin:16px 0;border-radius:0 8px 8px 0;font-size:15px;color:var(--text)}
.prose code{background:rgba(0,0,0,0.06);padding:2px 6px;border-radius:4px;font-size:14px}
.prose .katex{font-size:1.05em}
.prose .katex-display{margin:16px 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.prose table{width:100%;border-collapse:collapse;margin:16px 0}
.prose th,.prose td{border:1px solid #ddd;padding:8px 12px;text-align:left;font-size:14px}
.prose th{background:rgba(14,165,233,0.1);font-weight:600}
.prose img{max-width:100%;border-radius:8px;margin:16px 0}
.back-link{display:inline-flex;align-items:center;gap:4px;color:#0ea5e9;text-decoration:none;font-size:14px;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.note{background:rgba(14,165,233,0.08);border-radius:10px;padding:14px 18px;font-size:14px;margin:16px 0;border:1px solid rgba(14,165,233,0.2)}
.topic-callout{background:rgba(14,165,233,0.08);border-left:4px solid #0ea5e9;border-radius:8px;padding:12px 16px;margin:24px 0;font-size:14px}
.hero{text-align:center;padding:60px 0 40px}
.hero h1{font-size:clamp(24px,5vw,36px);margin-bottom:12px}
.hero p{color:var(--sub);font-size:18px;max-width:600px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:32px 0}
.card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 2px 12px var(--shadow);transition:transform .15s,box-shadow .15s;text-decoration:none;color:var(--text);display:block}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--shadow)}
.topic-card{display:flex;align-items:flex-start;gap:16px;min-height:150px}
.topic-icon{width:58px;height:58px;flex:0 0 58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 5px 12px rgba(0,0,0,.12)}
.topic-content{min-width:0}.topic-content h3{margin-top:2px}.osn-blue .topic-icon{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.osn-purple .topic-icon{background:linear-gradient(135deg,#7c3aed,#c084fc)}
.osn-green .topic-icon{background:linear-gradient(135deg,#059669,#34d399)}
.osn-orange .topic-icon{background:linear-gradient(135deg,#d97706,#fbbf24)}
.osn-pink .topic-icon{background:linear-gradient(135deg,#db2777,#f472b6)}
.card h3{font-size:18px;margin-bottom:8px}
.card p{color:var(--sub);font-size:14px}
.card.disabled{opacity:.6;cursor:default;pointer-events:none}
.card .badge{display:inline-block;background:#ff9800;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.btn{display:inline-block;background:var(--btn-bg);color:var(--btn-text);padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:600;margin-top:20px}
footer{text-align:center;padding:24px 0;color:var(--footer-text);font-size:14px;border-top:1px solid var(--footer-border);margin-top:40px}
.cbt-box{max-width:500px;margin:40px auto;background:var(--card);border-radius:16px;padding:32px;box-shadow:0 4px 24px var(--shadow)}
.cbt-box h2{font-size:22px;margin-bottom:20px;text-align:center}
.cbt-box label{display:block;font-weight:600;margin:16px 0 4px;color:var(--text)}
.cbt-box input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;background:var(--card);color:var(--text)}
.cbt-box button{width:100%;padding:14px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:24px}
.cbt-box button:hover{opacity:.9}
.info{background:rgba(76,175,80,0.1);border-radius:8px;padding:12px;margin:16px 0;font-size:14px;color:#2e7d32}
.loading{text-align:center;padding:40px;color:var(--sub)}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:48px;padding:24px 0 0;border-top:1px solid var(--card-border);background:transparent;position:static;z-index:auto}
.lesson-nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:82px;padding:7px 14px;border-radius:999px;color:#fff;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.02em;box-shadow:0 4px 12px rgba(37,99,235,.22);transition:transform .15s,box-shadow .15s,filter .15s}
.lesson-nav-btn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 6px 16px rgba(37,99,235,.3)}
.lesson-nav-back{background:linear-gradient(135deg,#64748b,#475569)}
.lesson-nav-next{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.lesson-nav-arrow{font-size:16px;line-height:1}
.lesson-nav-btn.is-disabled{opacity:.45;cursor:not-allowed;box-shadow:none;pointer-events:none}
[data-theme="dark"] .lesson-nav-back{background:linear-gradient(135deg,#64748b,#334155)}
[data-theme="dark"] .lesson-nav-next{background:linear-gradient(135deg,#a78bfa,#60a5fa)}
@media(max-width:600px){nav .links{gap:10px}nav .links a{font-size:13px}.lesson-nav{margin-top:36px}.lesson-nav-btn{min-width:76px;padding:6px 12px;font-size:12px}}
</style>
</head>
<body>
<nav><div class="container">
<a href="/" class="brand"> RoyClass</a>
<div class="links">
<a href="/">Beranda</a>
<a href="/materi/">Materi</a>
<a href="/bank-soal/">Bank Soal</a>
<a href="/osn/">OSN</a>
<a href="/cbt/">CBT</a>
<a href="/blog/">Blog</a>
<a href="/guru-wali/">Formulir</a>
<button class="dark-toggle" onclick="toggleAllDark()" id="darkBtn">🌙</button>
</div>
</div></nav>
<main><div class="container">{{ block "main" . }}{{ end }}</div></main>
<footer><div class="container">&copy; 2026 RoyClass &mdash; Mr. Royan Class</div></footer>
<script>
(function(){var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);updateBtn(t)})();
function toggleAllDark(){var el=document.documentElement,t=el.getAttribute("data-theme")==="dark"?"light":"dark";el.setAttribute("data-theme",t);localStorage.setItem("theme",t);updateBtn(t)}
function updateBtn(t){var b=document.getElementById("darkBtn");if(b)b.textContent=t==="dark"?"☀️":"🌙"}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  if(typeof renderMathInElement==="function"){
    renderMathInElement(document.body,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"$",right:"$",display:false},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false}
      ]
    })
  }
})
</script>
</body>
</html>
